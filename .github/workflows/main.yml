name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
            requirements-dev.txt

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-training.txt -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Compile package
        run: python -m compileall -q networksecurity app.py worker.py main.py

      - name: Lint correctness rules
        run: ruff check networksecurity app.py worker.py main.py scripts tests --select F,B

      - name: Run tests with branch coverage
        run: |
          python -m pytest \
            --cov=networksecurity.api \
            --cov=networksecurity.services \
            --cov=networksecurity.config \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Verify dependency graph
        run: python -m pip check

      - name: Audit serving dependencies
        run: pip-audit -r requirements.txt

  containers:
    name: container-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build serving image
        run: docker build --pull -t networksecurity-api:${{ github.sha }} .

      - name: Build training worker image
        run: docker build --pull -f Dockerfile.worker -t networksecurity-worker:${{ github.sha }} .

      - name: Verify non-root images
        run: |
          test "$(docker image inspect networksecurity-api:${{ github.sha }} --format '{{.Config.User}}')" = "app"
          test "$(docker image inspect networksecurity-worker:${{ github.sha }} --format '{{.Config.User}}')" = "app"

      - name: Smoke import serving image
        run: |
          docker run --rm networksecurity-api:${{ github.sha }} \
            python -c "from networksecurity.api.app import create_app; create_app(); print('api-import-ok')"

      - name: Smoke import worker image
        run: |
          docker run --rm networksecurity-worker:${{ github.sha }} \
            python -c "from networksecurity.services.training_worker import TrainingWorker; print('worker-import-ok')"
